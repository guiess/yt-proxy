services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
      - RAMMERHEAD_DOMAIN=${RAMMERHEAD_DOMAIN}
      - RAMMERHEAD_USER=${RAMMERHEAD_USER}
      - RAMMERHEAD_PASS_HASH=${RAMMERHEAD_PASS_HASH}
      - RAMMERHEAD_SHARE_KEY=${RAMMERHEAD_SHARE_KEY}
    depends_on:
      - invidious
      - companion
      - rammerhead

  rammerhead:
    build:
      context: ./docker/rammerhead
    restart: unless-stopped
    expose:
      - "8080"
      - "8081"
    environment:
      - RH_PUBLIC_HOST=${RAMMERHEAD_DOMAIN}
      - NODE_ENV=production
    healthcheck:
      test: wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1
      interval: 30s
      timeout: 5s
      retries: 3


  invidious:
    image: quay.io/invidious/invidious:latest
    restart: unless-stopped
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: ${POSTGRES_PASSWORD}
          host: postgres
          port: 5432
        check_tables: true
        host_binding: 0.0.0.0
        port: 3000
        external_port: 443
        https_only: true
        domain: ${DOMAIN}
        registration_enabled: true
        login_enabled: true
        captcha_enabled: false
        admins: []
        hmac_key: ${HMAC_KEY}
        invidious_companion:
          - private_url: http://companion:8282/companion
            public_url: https://${DOMAIN}/companion
        invidious_companion_key: ${COMPANION_KEY}
        default_user_preferences:
          local: true
          quality: dash
          quality_dash: 360
          region: US
          dark_mode: dark
          player_style: invidious
          save_player_pos: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: wget -nv --tries=1 --spider http://127.0.0.1:3000/api/v1/trending || exit 1
      interval: 30s
      timeout: 5s
      retries: 2

  companion:
    # Pinned to an immutable, date-prefixed upstream tag — never :latest.
    # :latest on this host is not trustworthy: it can be (and has been) shadowed
    # by a locally built image, which silently turns `docker compose pull` into a
    # no-op and makes it impossible to say what code is running. Immutable tags
    # also make rollback a one-line change instead of a rebuild.
    #
    # Registry digest for this tag (quay.io manifest list, verified 2026-08-15):
    #   sha256:298cad3da121cc6ee290f00e6cc02a64feb36085097a3bba03d88eaa31d4dafd
    # Verify after deploy:
    #   docker image inspect --format '{{index .RepoDigests 0}}' \
    #     quay.io/invidious/invidious-companion:2026.08.10-16cf10e
    #
    # Updating is a deliberate, manual tag bump: pick a newer tag from
    # https://quay.io/repository/invidious/invidious-companion?tab=tags
    image: quay.io/invidious/invidious-companion:2026.08.10-16cf10e
    restart: unless-stopped
    # Docker's default soft nofile limit is 1024. Companion leaks eventpoll/
    # eventfd pairs at ~53.5 FDs per 1,000 videoplayback requests, so it hit
    # EMFILE ("Too many open files" -> unrecoverable Rust panic) roughly every
    # 1.76 days and killed every in-flight stream. This raises the ceiling, it
    # does NOT fix the leak: 65536 buys ~138 days at the measured request rate,
    # which is headroom to observe the leak instead of being killed by it.
    # Both soft and hard are set explicitly — soft > hard fails container start,
    # and the long form is required when specifying both.
    # Scoped to this service on purpose: a daemon-wide default-ulimits in
    # /etc/docker/daemon.json would raise it for postgres/caddy/gluetun too and
    # needs a dockerd restart (i.e. full stack downtime).
    # NOTE: ulimits apply at container CREATION. `docker compose restart` will
    # not pick this up — the container must be recreated with `up -d`.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - COMPANION_PORT=8282
      - COMPANION_HOST=0.0.0.0
      - COMPANION_INNER_TUBE_FORCE_LOCATION=US
      - SERVER_SECRET_KEY=${COMPANION_KEY}
    # Companion image is distroless (no shell/wget), so disable healthcheck
    healthcheck:
      disable: true

  postgres:
    image: postgres:14
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/sql:/config/sql:ro
      - ./docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh:ro
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kemal -d invidious"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
